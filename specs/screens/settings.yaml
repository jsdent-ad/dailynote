version: "2.0"

screen:
  id: screen-03
  name: 설정
  route: /settings
  layout: grouped-list
  description: >
    테마, 데이터 백업/복원 등 최소한의 설정.

data_requirements:
  - resource: daily_notes
    operations: [export_all]
  - resource: todos
    operations: [export_all]

state:
  local:
    - theme: "라이트(light) 또는 다크(dark), AsyncStorage 저장"

components:
  - id: theme_toggle
    type: toggle
    position: group-appearance
    function: 라이트/다크 테마 전환
    interactions:
      - "토글 → 즉시 테마 적용 + AsyncStorage 저장"

  - id: backup_button
    type: list-item
    position: group-data
    function: 전체 데이터 JSON 내보내기
    interactions:
      - "탭 → daily_notes + todos 전체 JSON 생성"
      - "생성 완료 → OS 공유 시트 (파일 저장/전송)"

  - id: restore_button
    type: list-item
    position: group-data
    function: JSON 파일에서 데이터 복원
    interactions:
      - "탭 → 파일 선택 다이얼로그"
      - "파일 선택 → '기존 데이터를 덮어씁니다' 확인 다이얼로그"
      - "확인 → 데이터 복원 + 성공 알림"
      - "잘못된 파일 → 에러 알림"

  - id: app_info
    type: static-text
    position: group-info
    function: 앱 버전, 빌드 번호 표시

tests:
  - name: 테마 전환
    when: 테마 토글 변경
    then:
      - "즉시 다크/라이트 전환"
      - "앱 재시작 시 선택된 테마 유지"

  - name: 백업-복원 사이클
    when: 백업 후 복원
    then:
      - "백업 → JSON 파일 생성 + 공유 시트"
      - "복원 → 확인 다이얼로그 → 데이터 복원 → 메인 화면 반영"

  - name: 잘못된 파일 복원
    when: 올바르지 않은 JSON 파일 선택
    then:
      - "에러 메시지 표시"
      - "기존 데이터 유지 (손상 없음)"
